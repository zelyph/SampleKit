[package]
name = "samplekit"
version = "1.0.0-rc.3"
edition = "2024"
description = "Sample data in plain Markdown: computed, current, tracked"
repository = "https://github.com/zelyph/SampleKit"
homepage = "https://zelyph.github.io/SampleKit/"
documentation = "https://zelyph.github.io/SampleKit/latest/"
readme = "README.md"
keywords = ["samples", "notebook", "markdown", "uncertainty", "cli"]
categories = ["command-line-utilities", "science"]
license = "MIT"
authors = ["zelyph"]
# What crates.io receives: the crate, the demo its build embeds, and the
# themes it embeds, the files of the documentation's colours page.
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/build.rs",
    "/src/",
    "/examples/tensile/",
    "/docs/templates/colours/*.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/THIRD-PARTY-LICENSES.md",
]

[[bin]]
name = "samplekit"
path = "src/interfaces/cli.rs"

[lib]
name = "samplekit"
crate-type = ["rlib", "cdylib"]

[features]
python = ["dep:pyo3"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde", "alloc"] }
unicode-ident = "1"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = { version = "1", features = ["raw_value"] }
toml = { version = "0.9", features = ["preserve_order"] }
unicode-width = "0.2"
unicode-segmentation = "1"
unicode-normalization = "0.1.25"
anstyle = "1.0"
anstream = "1.0"
anstyle-parse = "1.0"
sha2 = "0.10"
clap = { version = "4.5", features = ["derive"] }
# Dynamic completion is experimental in clap_complete: pinned exactly.
clap_complete = { version = "=4.5.59", features = ["unstable-dynamic"] }
pyo3 = { version = "0.29", optional = true }
ctrlc = { version = "3.5.2", features = ["termination"] }
toml_edit = "0.25"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
gix = { version = "0.88", default-features = false, features = ["sha1"] }
# Writes the history's pack when it is compacted: the versions gix uses, with
# the features that write a pack and its index.
crossterm = "0.29"
tui-markdown = { version = "0.3.9", default-features = false }
nucleo-matcher = "0.3.1"
strsim = "0.11"
globset = "0.4.20"
walkdir = "2.5.0"
tempfile = "3.27.0"
textwrap = { version = "0.16.4", default-features = false, features = ["unicode-width"] }
opener = { version = "0.8.5", default-features = false }
etcetera = "0.11.0"
csv = "1.4.0"
dunce = "1.0.5"
shell-words = "1.1.1"
gethostname = "1.1.0"
rat-text = "3.1.0"
rat-markdown = "0.7.3"
v_latexescape = "0.16"
html-escape = "0.2"
notify = "8"

[lints.clippy]
all = { level = "deny", priority = -1 }
