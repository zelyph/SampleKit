[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "samplekit"
description = "Sample data in plain Markdown: computed, current, tracked"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = ["matplotlib>=3.8"]
license = "MIT"
license-files = ["LICENSE", "THIRD-PARTY-LICENSES.md"]
readme = "README.md"
authors = [{ name = "zelyph" }]
keywords = ["samples", "notebook", "markdown", "uncertainty"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/zelyph/SampleKit"
Documentation = "https://zelyph.github.io/SampleKit/latest/"
Changelog = "https://github.com/zelyph/SampleKit/blob/main/CHANGELOG.md"
Issues = "https://github.com/zelyph/SampleKit/issues"

[tool.maturin]
python-source = "python"
module-name = "samplekit._native"
features = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
